name: Resolve Issue with OpenHands

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  resolve:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@openhands-agent'))
    runs-on: ubuntu-latest

    env:
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini/gemini-2.5-pro' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GITHUB_USERNAME: ${{ secrets.PAT_USERNAME || github.actor }}
      GIT_USERNAME: ${{ secrets.PAT_USERNAME || github.actor }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      MAX_ITERATIONS: ${{ vars.OPENHANDS_MAX_ITER || 10 }}
      TARGET_BRANCH: ${{ vars.TARGET_BRANCH || 'main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OpenHands
        run: |
          python -m pip install --upgrade pip
          pip install openhands-ai

      - name: Comment start
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            github.rest.issues.createComment({
              issue_number: Number(process.env.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `OpenHands started fixing this issue. Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Attempt to resolve issue
        run: |
          cd /tmp
          python -m openhands.resolver.resolve_issue \
            --selected-repo "${{ github.repository }}" \
            --issue-number "$ISSUE_NUMBER" \
            --issue-type issue \
            --max-iterations "$MAX_ITERATIONS"

      - name: Check resolution result
        id: check_result
        if: always()
        run: |
          if cd /tmp && grep -q '"success":true' output/output.jsonl; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload resolver output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resolver-output
          path: /tmp/output/output.jsonl
          if-no-files-found: ignore

      - name: Create draft PR or branch
        if: always()
        run: |
          cd /tmp
          if [ "${{ steps.check_result.outputs.success }}" = "true" ]; then
            python -m openhands.resolver.send_pull_request \
              --issue-number "$ISSUE_NUMBER" \
              --target-branch "$TARGET_BRANCH" \
              --pr-type draft
          else
            python -m openhands.resolver.send_pull_request \
              --issue-number "$ISSUE_NUMBER" \
              --pr-type branch \
              --send-on-failure
          fi

      - name: Remove fix-me label
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: Number(process.env.ISSUE_NUMBER),
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'fix-me'
              });
            } catch (error) {
              core.info(`Label removal skipped: ${error.message}`);
            }
