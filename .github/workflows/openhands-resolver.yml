name: Resolve Issue with OpenHands

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'fix-me') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@openhands-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini/gemini-2.5-pro' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      TARGET_BRANCH: ${{ vars.TARGET_BRANCH || github.event.repository.default_branch }}
      OPENHANDS_MAX_ITER: ${{ vars.OPENHANDS_MAX_ITER || '20' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Prepare issue task
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const prompt = [
              `You are working in the checked-out repository ${context.repo.owner}/${context.repo.repo}.`,
              '',
              `Fix GitHub issue #${issue.number}: ${issue.title}`,
              '',
              'Issue body:',
              issue.body || '(empty)',
              '',
              comment ? `Trigger comment:\n${comment.body}` : '',
              '',
              'Requirements:',
              '- Make the smallest correct code change.',
              '- Add or update tests when the repository has a relevant test setup.',
              '- Run the relevant checks if they are discoverable.',
              '- Do not commit changes yourself; leave the working tree modified for the workflow to commit.',
            ].filter(Boolean).join('\n');
            fs.writeFileSync('/tmp/openhands-task.md', prompt);

      - name: Comment start
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `OpenHands started working on this issue. Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Run OpenHands headless
        run: |
          uvx --python 3.12 --from openhands-ai openhands \
            --override-with-envs \
            --headless \
            --json \
            -f /tmp/openhands-task.md \
            > /tmp/openhands-output.jsonl

      - name: Upload OpenHands output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openhands-output
          path: /tmp/openhands-output.jsonl
          if-no-files-found: ignore

      - name: Create pull request
        id: create_pr
        run: |
          if git diff --quiet; then
            echo "No changes produced by OpenHands."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="openhands/issue-${ISSUE_NUMBER}"
          git config user.name "${{ secrets.PAT_USERNAME || github.actor }}"
          git config user.email "${{ secrets.PAT_USERNAME || github.actor }}@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "fix: resolve issue #${ISSUE_NUMBER} with OpenHands"
          git push --force-with-lease origin "$branch"

          pr_url="$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$branch" \
            --title "fix: ${ISSUE_TITLE}" \
            --body "Automated OpenHands attempt for #${ISSUE_NUMBER}." \
            --draft)"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            const created = '${{ steps.create_pr.outputs.created }}' === 'true';
            const prUrl = '${{ steps.create_pr.outputs.pr_url }}';
            const body = created
              ? `OpenHands created a draft PR: ${prUrl}`
              : `OpenHands finished, but no repository changes were produced. Check the workflow logs and artifact for details.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });

      - name: Remove fix-me label
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN || github.token }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                name: 'fix-me'
              });
            } catch (error) {
              core.info(`Label removal skipped: ${error.message}`);
            }
